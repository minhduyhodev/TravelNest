name: travelnest

services:
  mysql:
    image: mysql:8.4
    container_name: travelnest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-travelnest}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Bangkok
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - travelnest-network

  redis:
    image: redis:7-alpine
    container_name: travelnest-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - travelnest-network

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    container_name: travelnest-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "mvn spring-boot:run"
    volumes:
      - ./backend:/app
      - maven_cache:/root/.m2
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/travelnest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Bangkok
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - travelnest-network

  frontend:
    image: node:20-alpine
    container_name: travelnest-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_APP_NAME: ${VITE_APP_NAME:-TravelNest}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
      VITE_DEFAULT_LOCALE: ${VITE_DEFAULT_LOCALE:-vi}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - travelnest-network

volumes:
  mysql_data:
  redis_data:
  maven_cache:
  frontend_node_modules:

networks:
  travelnest-network:
    driver: bridge
