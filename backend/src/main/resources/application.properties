spring.application.name=travelnest-backend

# Server
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/api}

# Database - MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travelnest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate / Flyway
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

# JSON / Timezone
spring.jackson.time-zone=Asia/Bangkok

# Logging
logging.level.org.springframework.web=${APP_LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${APP_LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${APP_LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${APP_LOG_LEVEL_SQL_BIND:INFO}

# OpenAPI / Swagger
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
jwt.secret=${JWT_SECRET:please-change-this-secret-key-please-change-this-secret-key}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

# Email
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:nhom3fptct@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:nguzoohimhlamvqn}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# VNPay
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:}
vnpay.return-url=${VNPAY_RETURN_URL:}

# MoMo
momo.partner-code=${MOMO_PARTNER_CODE:}
momo.access-key=${MOMO_ACCESS_KEY:}
momo.secret-key=${MOMO_SECRET_KEY:}
momo.endpoint=${MOMO_ENDPOINT:}
momo.return-url=${MOMO_RETURN_URL:}
momo.notify-url=${MOMO_NOTIFY_URL:}

# App
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.reset-otp-expiration-minutes=${APP_AUTH_RESET_OTP_EXPIRATION_MINUTES:15}
app.auth.debug-return-otp=${APP_AUTH_DEBUG_RETURN_OTP:false}
app.mail.enabled=${APP_MAIL_ENABLED:true}
app.mail.from=${APP_MAIL_FROM:no-reply@travelnest.local}
app.seed.default-admin.enabled=${APP_SEED_DEFAULT_ADMIN_ENABLED:true}
app.seed.default-admin.email=${APP_SEED_DEFAULT_ADMIN_EMAIL:admin@travelnest.local}
app.seed.default-admin.password=${APP_SEED_DEFAULT_ADMIN_PASSWORD:Admin@123}
app.seed.default-admin.full-name=${APP_SEED_DEFAULT_ADMIN_FULL_NAME:TravelNest Admin}
app.seed.default-admin.phone=${APP_SEED_DEFAULT_ADMIN_PHONE:0900000000}
app.seed.default-admin.preferred-lang=${APP_SEED_DEFAULT_ADMIN_PREFERRED_LANG:vi}
