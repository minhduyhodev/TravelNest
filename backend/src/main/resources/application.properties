spring.application.name=backend

# Server
server.port=${SERVER_PORT:8080}

# Database - MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/travelnest?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Bangkok

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JSON / Timezone
spring.jackson.time-zone=Asia/Bangkok

# Logging
logging.level.org.springframework.web=${APP_LOG_LEVEL_WEB:INFO}
logging.level.org.springframework.security=${APP_LOG_LEVEL_SECURITY:INFO}
logging.level.org.hibernate.SQL=${APP_LOG_LEVEL_SQL:INFO}
logging.level.org.hibernate.orm.jdbc.bind=${APP_LOG_LEVEL_SQL_BIND:INFO}

# OpenAPI / Swagger
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# JWT
jwt.secret=${JWT_SECRET:change-me-before-production}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
